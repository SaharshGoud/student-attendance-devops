apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: attendance
          image: student-attendance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DB_FILE
              value: /app/data/attendance.db
          volumeMounts:
            - name: attendance-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: attendance-data
          persistentVolumeClaim:
            claimName: attendance-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance
spec:
  selector:
    app: student-attendance
  ports:
    - port: 80
      targetPort: 3000
  type: NodePort
